<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Mini — Garra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Sem bloquear o render: o robô pode estar numa rede sem saída para a
     internet, e aí o painel esperaria o DNS estourar antes de desenhar. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/reachy.css">
</head>
<body>

<header>
  <h1><span class="logo">◉</span> Reachy Mini</h1>
  <div id="pills-topo">
    <span class="pill" id="p-conexao"><span class="status-dot offline"></span> <span data-i18n="pill.conectando"></span></span>
    <span class="pill" id="p-modo" data-i18n="pill.modo"></span>
    <span class="pill" id="p-estado" data-i18n="pill.ocioso"></span>
    <span class="pill" id="p-camera"><span class="status-dot offline"></span> <span data-i18n="pill.camera"></span></span>
    <span class="pill" id="p-eventos"><span class="status-dot offline"></span> <span data-i18n="pill.eventos"></span></span>
  </div>
  <select id="idioma" aria-label="Language / Idioma">
    <option value="en">EN</option>
    <option value="pt">PT</option>
  </select>
  <button id="estop" class="perigo" data-i18n="estop.botao" data-i18n-title="estop.dica"></button>
</header>

<div id="faixa-estop">
  <span data-i18n="estop.faixa"></span>
  <button id="btn-liberar" class="primario" data-i18n="estop.liberar"></button>
  <button id="btn-neutro-apos" data-i18n="estop.liberar_centralizar"></button>
</div>

<div id="faixa-servicos" hidden>
  <strong data-i18n="limitado.titulo"></strong>
  <ul id="lista-servicos"></ul>
</div>

<main>

  <!-- ── status ──────────────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="status.titulo"></span> <span class="conta" id="uptime"></span></h2>
    <div class="status-lista" id="status-lista"></div>
    <div class="linha" style="margin-top:12px">
      <button data-acao="wake_up" data-i18n="status.acordar"></button>
      <button data-acao="sleep" data-i18n="status.dormir"></button>
      <button id="btn-neutro" data-i18n="status.neutro"></button>
      <button id="btn-tracking" data-i18n="status.tracking"></button>
    </div>
  </section>

  <!-- ── câmera ──────────────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="camera.titulo"></span> <span class="conta" id="camera-info"></span></h2>
    <div class="moldura-camera" id="moldura-camera">
      <img id="video" data-i18n-alt="camera.alt" alt="">
      <div class="aviso-camera" id="aviso-camera" data-i18n="camera.parada"></div>
    </div>
    <div class="linha" style="margin-top:10px">
      <button id="btn-stream" class="primario" data-i18n="camera.iniciar"></button>
      <button id="btn-atualizar" data-i18n="camera.atualizar"></button>
      <button id="btn-capturar" data-i18n="camera.capturar"></button>
      <button id="btn-fullscreen" data-i18n="camera.fullscreen"></button>
    </div>
  </section>

  <!-- ── controle manual ─────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2 data-i18n="manual.titulo"></h2>
    <div class="joystick" id="joystick" role="application"
         data-i18n-aria-label="manual.joystick" aria-label="" tabindex="0">
      <div class="knob" id="knob"></div>
    </div>
    <div class="controle-slider">
      <label><span data-i18n="manual.intensidade"></span> <b id="v-intensidade">0.60</b></label>
      <input type="range" id="intensidade" min="0.05" max="1" step="0.05" value="0.6">
    </div>
    <div class="controle-slider">
      <label><span data-i18n="manual.duracao"></span> <b id="v-duracao">0.8 s</b></label>
      <input type="range" id="duracao" min="0.2" max="3" step="0.1" value="0.8">
    </div>
    <div class="grade-botoes" style="margin-top:10px">
      <button data-antenas="up" data-i18n="manual.antenas_cima"></button>
      <button data-antenas="down" data-i18n="manual.antenas_baixo"></button>
      <button data-antenas="wiggle" data-i18n="manual.antenas_balancar"></button>
      <button data-antenas="neutral" data-i18n="manual.antenas_neutro"></button>
    </div>
  </section>

  <!-- ── expressões ──────────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="expr.titulo"></span> <span class="conta" id="conta-expressoes"></span></h2>
    <div class="grade-botoes" id="expressoes-principais"></div>
    <div class="linha" style="margin-top:12px">
      <select id="sel-emocao" style="flex:1"></select>
      <button id="btn-emocao" data-i18n="expr.executar"></button>
    </div>
  </section>

  <!-- ── movimentos e danças ─────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="mov.titulo"></span> <span class="conta" id="conta-dancas"></span></h2>
    <div class="linha">
      <button data-acao="dance" class="primario" data-i18n="mov.dancar"></button>
      <button data-acao="greet" data-i18n="mov.cumprimentar"></button>
      <button data-acao="nod" data-i18n="mov.sim"></button>
      <button data-acao="shake_head" data-i18n="mov.nao"></button>
    </div>
    <div class="linha" style="margin-top:10px">
      <select id="sel-danca" style="flex:1"></select>
      <button id="btn-danca" data-i18n="mov.executar"></button>
    </div>
  </section>

  <!-- ── comandos rápidos ────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2 data-i18n="rapidos.titulo"></h2>
    <div class="grade-botoes" id="rapidos"></div>
  </section>

  <!-- ── chat ────────────────────────────────────────────────────────────── -->
  <section class="card glass-panel largo">
    <h2><span data-i18n="chat.titulo"></span> <span class="conta" id="chat-info"></span></h2>
    <div class="chat-corpo" id="chat-corpo"></div>
    <div class="chat-entrada">
      <textarea id="chat-texto" rows="2" data-i18n-placeholder="chat.placeholder" placeholder=""></textarea>
      <button id="btn-enviar" class="primario" data-i18n="chat.enviar"></button>
    </div>
    <div class="linha" style="margin-top:9px">
      <button id="btn-falar" data-i18n-title="chat.fala_dica" data-i18n="chat.fala_desligada"></button>
      <button id="btn-limpar-chat" data-i18n="chat.limpar"></button>
      <span class="pill" id="p-chat">—</span>
    </div>
  </section>

  <!-- ── identidade do assistente (interface REMOTA do Garra) ─────────────── -->
  <section class="card glass-panel" id="identidade-bloco" hidden>
    <h2><span data-i18n="ident.titulo"></span> <span class="conta" id="identidade-info"></span></h2>
    <div class="campo">
      <label for="identidade-nome" data-i18n="ident.nome"></label>
      <input type="text" id="identidade-nome" maxlength="32" placeholder="Garra">
    </div>
    <div class="campo">
      <label for="identidade-operador" data-i18n="ident.operador"></label>
      <input type="text" id="identidade-operador" maxlength="32">
    </div>
    <div class="dica" data-i18n="ident.operador_dica"></div>
    <div class="campo">
      <label for="identidade-persona" data-i18n="ident.persona"></label>
      <textarea id="identidade-persona" rows="5" maxlength="4000"></textarea>
    </div>
    <div class="dica" data-i18n="ident.aviso"></div>
    <div class="linha">
      <button id="btn-identidade-salvar" class="primario" data-i18n="ident.salvar"></button>
      <button id="btn-identidade-reset" data-i18n="ident.restaurar"></button>
      <span class="pill" id="p-identidade">—</span>
    </div>
  </section>

  <!-- ── agentes (registry factual do Garra, SOMENTE leitura) ────────────── -->
  <!-- Os cards vêm inteiros de GET /api/robot/agents; nada é duplicado aqui.
       Sem toggles, sem edição, sem mensagem: um registry mostra fatos. -->
  <section class="card glass-panel largo" id="agentes-bloco"
           data-testid="reachy-agents-section" hidden>
    <h2><span data-i18n="agentes.titulo"></span> <span class="conta" id="agentes-info"></span></h2>
    <div id="agentes-cards"></div>
    <div class="dica" id="agentes-indisponivel" data-testid="reachy-agents-unavailable"
         data-i18n="agentes.indisponivel" hidden></div>
    <div class="linha">
      <button id="btn-agentes-atualizar" data-i18n="agentes.atualizar"></button>
      <span class="pill" id="p-agentes">—</span>
    </div>
    <div class="dica" data-i18n="agentes.nota"></div>
  </section>

  <!-- ── ritmo da conversa ───────────────────────────────────────────────── -->
  <section class="card glass-panel" id="conversa-bloco">
    <h2><span data-i18n="conversa.titulo"></span> <span class="conta" id="conversa-info"></span></h2>
    <!-- Controle mestre, antes do modo: o modo decide QUANDO uma fala
         automática pode sair, este decide SE ela existe. -->
    <label class="caixa" id="linha-conversa-mestre">
      <input type="checkbox" id="conversa-mestre">
      <span data-i18n="conversa.mestre"></span>
    </label>
    <div class="dica" data-i18n="conversa.mestre_dica"></div>
    <label class="caixa" data-conversa-sub="1">
      <input type="checkbox" id="conversa-ack-on">
      <span data-i18n="conversa.ack_on"></span>
    </label>
    <label class="caixa" data-conversa-sub="1">
      <input type="checkbox" id="conversa-tool-on">
      <span data-i18n="conversa.tool_on"></span>
    </label>
    <label class="caixa" data-conversa-sub="1">
      <input type="checkbox" id="conversa-saudacao">
      <span data-i18n="conversa.saudacao"></span>
    </label>
    <div class="linha" role="group" data-i18n-aria-label="conversa.titulo">
      <button id="btn-modo-fast" data-modo="fast" data-i18n="conversa.rapido"
              data-i18n-title="conversa.rapido_dica"></button>
      <button id="btn-modo-informative" data-modo="informative" data-i18n="conversa.informativo"
              data-i18n-title="conversa.informativo_dica"></button>
    </div>
    <div class="controle-slider">
      <label for="conversa-atraso"><span data-i18n="conversa.atraso"></span>
        <b id="v-conversa-atraso">—</b></label>
      <input type="range" id="conversa-atraso" min="0" max="10000" step="250">
    </div>
    <div class="controle-slider">
      <label for="conversa-progresso-ms"><span data-i18n="conversa.progresso_atraso"></span>
        <b id="v-conversa-progresso-ms">—</b></label>
      <input type="range" id="conversa-progresso-ms" min="3000" max="60000" step="1000">
    </div>
    <div class="linha" style="margin-top:4px">
      <label class="linha" style="gap:6px;font-size:.82rem">
        <input type="checkbox" id="conversa-progresso">
        <span data-i18n="conversa.progresso"></span>
      </label>
    </div>
    <div class="linha" style="margin-top:10px">
      <button id="btn-conversa-salvar" class="primario" data-i18n="conversa.salvar"></button>
      <span class="pill" id="p-conversa">—</span>
    </div>
    <div class="status-lista" id="conversa-metricas" style="margin-top:12px"></div>
  </section>

  <!-- ── apps ────────────────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="apps.titulo"></span> <span class="conta" id="conta-apps"></span></h2>
    <div class="lista-apps" id="lista-apps"><div class="vazio" data-i18n="apps.carregando"></div></div>
    <div class="linha" style="margin-top:10px">
      <button id="btn-apps-atualizar" data-i18n="apps.atualizar"></button>
      <button id="btn-app-parar" data-i18n="apps.parar"></button>
      <button id="btn-app-reiniciar" data-i18n="apps.reiniciar"></button>
    </div>
  </section>

  <!-- ── logs ────────────────────────────────────────────────────────────── -->
  <section class="card glass-panel">
    <h2><span data-i18n="logs.titulo"></span> <span class="conta" id="conta-eventos"></span></h2>
    <div class="logs" id="logs"></div>
  </section>

</main>

<script src="/static/i18n.js"></script>
<script src="/static/reachy.js"></script>
</body>
</html>
