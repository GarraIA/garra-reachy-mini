<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garra Reachy Mini — Settings</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>🦾 Garra Reachy Mini</h1>
    <p class="dica" data-i18n="cfg.precedencia"></p>
    <p class="dica">
      <a href="/reachy" data-i18n="cfg.abrir_painel"></a>
    </p>

    <form id="formulario">
      <fieldset>
        <legend data-i18n="cfg.conversa"></legend>
        <p class="dica" data-i18n="cfg.conversa_nota"></p>
        <label><span data-i18n="cfg.gateway_url"></span>
          <input name="gateway_url" placeholder="http://127.0.0.1:3888" />
          <small data-i18n="cfg.gateway_url_ajuda"></small>
        </label>
        <label><span data-i18n="cfg.agente"></span>
          <input name="agent_id" placeholder="reachy_voice" />
        </label>
        <label><span data-i18n="cfg.modelo_gateway"></span>
          <input name="gateway_model" data-i18n-placeholder="cfg.vazio_padrao" placeholder="" />
        </label>
        <label><span data-i18n="cfg.chave_gateway"></span>
          <input name="gateway_key" type="password" autocomplete="off"
                 data-i18n-placeholder="cfg.deixe_em_branco" placeholder="" />
          <small data-i18n="cfg.chave_ajuda"></small>
        </label>
      </fieldset>

      <fieldset>
        <legend data-i18n="cfg.voz"></legend>
        <label><span data-i18n="cfg.voz_url"></span>
          <input name="voz_url" placeholder="http://192.0.2.10:8123" />
          <small data-i18n="cfg.voz_ajuda"></small>
        </label>
      </fieldset>

      <fieldset>
        <legend data-i18n="cfg.reserva"></legend>
        <p class="dica" data-i18n="cfg.reserva_nota"></p>
        <label><span data-i18n="cfg.provider"></span>
          <input name="provider" placeholder="openrouter" />
        </label>
        <label><span data-i18n="cfg.modelo"></span>
          <input name="model" placeholder="anthropic/claude-haiku-4.5" />
        </label>
        <label><span data-i18n="cfg.binario"></span>
          <input name="garra_bin" data-i18n-placeholder="cfg.vazio_auto" placeholder="" />
        </label>
        <label><span data-i18n="cfg.turnos"></span>
          <input name="janela_turnos" type="number" min="0" max="30" placeholder="8" />
        </label>
      </fieldset>

      <button type="submit" data-i18n="cfg.salvar"></button>
      <span id="status" role="status"></span>
    </form>

    <details>
      <summary data-i18n="cfg.efetiva"></summary>
      <pre id="efetiva" data-i18n="cfg.carregando"></pre>
    </details>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
