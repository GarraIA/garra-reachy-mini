[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"


[project]
name = "garra_reachy_mini"
version = "1.3.0-rc.3"
description = "AI control panel for Reachy Mini: expressions, dances, native face tracking, camera and an optional voice assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Michel Duek", email = "michelduek@gmail.com" }]
keywords = ["reachy-mini-app", "reachy-mini", "robotics", "voice-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Toda dependência daqui é instalada num `apps_venv` COMPARTILHADO com os
    # outros apps do robô (`apps/sources/local_common_venv.py:55-65`, sem
    # `--no-deps`). Por isso: poucas, e sem pino apertado — um `==` nosso vira
    # conflito no app do vizinho. O teto em 2.0 existe porque uma major nova do
    # SDK pode trocar a API sob os pés de todo mundo no mesmo venv.
    "reachy-mini>=1.9,<2.0",
    "numpy",
    "requests",
    "pyyaml",
    "fastapi",      # rotas do painel (web/api.py importa direto)
    "pydantic>=2",  # página de configurações (main.py importa direto)
    "httpx",        # cliente async da ponte de chat com o gateway (web/chat.py)
    "scipy",        # decomposição de euler em robo/limites.py
]

[project.urls]
Homepage = "https://github.com/GarraIA/garra-reachy-mini"
Source = "https://github.com/GarraIA/garra-reachy-mini"
Issues = "https://github.com/GarraIA/garra-reachy-mini/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."reachy_mini_apps"]
# A chave, o `project.name` e o diretório do pacote têm de ser a MESMA string:
# o daemon lê `site_packages/<chave>/main.py` por regex para achar a
# `custom_app_url`, desinstala com `pip uninstall <chave>` e procura o
# `<chave>*.dist-info` para saber se há atualização. Divergir quebra os três em
# silêncio.
garra_reachy_mini = "garra_reachy_mini.main:GarraReachyMini"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["garra_reachy_mini*"]

[tool.setuptools.package-data]
# A chave é `"*"` — "todo pacote deste projeto" — e não o nome do pacote.
#
# Aqui o nome casava e o painel era empacotado; num fork que renomeasse o
# diretório, não. Foi exatamente o que aconteceu no build de staging: a chave
# ficou apontando para o nome antigo, nenhum estático entrou no wheel, e o
# painel embutido virou `{"detail":"Not Found"}`.
#
# Os padrões continuam explícitos em vez de `**/*`: o glob recursivo empacotava
# os `__pycache__/*.pyc` junto.
"*" = ["static/*.html", "static/*.css", "static/*.js"]
